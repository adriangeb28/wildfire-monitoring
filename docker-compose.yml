# Wildfire monitoring - local stack (Workshop 2)
#
#   docker compose up airflow-init        # once: migrate metadata DB, create admin user
#   docker compose up -d                  # Airflow UI at http://localhost:8080 (airflow / airflow)
#
# Services
#   postgres            Airflow metadata database (PostgreSQL 16)
#   airflow-init        one-shot: folders, permissions, `airflow db migrate`, admin user
#   airflow-webserver   UI and REST API on :8080
#   airflow-scheduler   schedules DAGs and runs tasks (LocalExecutor: tasks run as
#                       subprocesses of the scheduler, so no separate worker/broker)
#   airflow-triggerer   runs deferrable operators
#   warehouse-db        PostGIS database with the canonical schema (sql/schema.sql),
#                       loaded on first start; used from Workshop 3 on (port 5433)
#
# Volumes: DAGs, source code, config, reference layer and the three data-lake
# folders are bind-mounted, so DAG edits reload live and every output persists
# on the host after the containers stop.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: wildfire-airflow:2.10.5
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: "utc"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # FileSensor connection: base path of the Bronze layer inside the containers
    AIRFLOW_CONN_FS_BRONZE: '{"conn_type": "fs", "extra": {"path": "/opt/airflow/datalake_bronze"}}'
    PROJECT_ROOT: /opt/airflow
    PYTHONPATH: /opt/airflow/src
    DATALAKE_BRONZE: /opt/airflow/datalake_bronze
    DATALAKE_SILVER: /opt/airflow/datalake_silver
    DATALAKE_GOLD: /opt/airflow/datalake_gold
    PYSPARK_PYTHON: /usr/local/bin/python
    PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
    SPARK_LOCAL_IP: 127.0.0.1
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/src
    - ./config:/opt/airflow/config
    - ./reference:/opt/airflow/reference
    - ./datalake_bronze:/opt/airflow/datalake_bronze
    - ./datalake_silver:/opt/airflow/datalake_silver
    - ./datalake_gold:/opt/airflow/datalake_gold
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /sources/airflow/logs /sources/airflow/dags /sources/airflow/plugins \
                 /sources/datalake_bronze /sources/datalake_silver /sources/datalake_gold
        chown -R "${AIRFLOW_UID:-50000}:0" /sources/airflow /sources/datalake_bronze \
                 /sources/datalake_silver /sources/datalake_gold
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"
    volumes:
      - .:/sources

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  warehouse-db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fires
      POSTGRES_PASSWORD: fires
      POSTGRES_DB: fires
    ports:
      - "5433:5432"
    volumes:
      - warehouse-db:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/20_schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fires"]
      interval: 10s
      retries: 5
    restart: always

volumes:
  airflow-db:
  warehouse-db:

